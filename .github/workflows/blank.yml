name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Montar e compilar
        run: |
          set -e
          Z=$(find . -iname '*.zip' | head -1)
          if [ -n "$Z" ]; then mkdir -p proj; unzip -q -o "$Z" -d proj; fi
          S=$(find . -name settings.gradle.kts | head -1)
          if [ -z "$S" ]; then echo "PROJETO NAO ENCONTRADO"; ls -R | head -40; exit 1; fi
          cd "$(dirname "$S")"
          gradle assembleDebug --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: Nexora-GX-apk
          path: out/*.apk
